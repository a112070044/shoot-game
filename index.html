<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>地下室 B2</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#d8d2c4;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #touch{position:fixed;inset:0;touch-action:none;z-index:2}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
  #hud.on{display:block}
  #aim{position:absolute;inset:0}
  #cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:.8}
  #cross i{position:absolute;background:#e9e2cf;box-shadow:0 0 2px #000}
  #cross i:nth-child(1){left:12px;top:12px;width:2px;height:2px;border-radius:50%}
  #cross i:nth-child(2){left:0;top:12.5px;width:7px;height:1px}
  #cross i:nth-child(3){right:0;top:12.5px;width:7px;height:1px}
  #cross i:nth-child(4){left:12.5px;top:0;width:1px;height:7px}
  #cross i:nth-child(5){left:12.5px;bottom:0;width:1px;height:7px}
  #hit{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0;transform:rotate(45deg)}
  #hit::before,#hit::after{content:"";position:absolute;background:#ff5a4a}
  #hit::before{left:0;right:0;top:14px;height:2px}
  #hit::after{top:0;bottom:0;left:14px;width:2px}
  #hit.head::before,#hit.head::after{background:#ffd23a}
  .tl{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
  .lbl{font-size:11px;letter-spacing:.2em;opacity:.6}
  #hpbar{width:150px;height:8px;margin-top:5px;border:1px solid rgba(216,210,196,.45);background:rgba(0,0,0,.4)}
  #hpfill{height:100%;width:100%;background:#b93a2c;transition:width .15s}
  .tc{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;
    font-size:12px;letter-spacing:.2em;opacity:.75;white-space:nowrap}
  #score{font-size:18px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
  #ammo{position:absolute;right:calc(128px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
    font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
  #ammo small{font-size:13px;opacity:.6;font-weight:400}
  #ammo.low{color:#ff5a4a}
  body.desk #ammo{right:28px}
  #banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:26px;letter-spacing:.5em;
    opacity:0;transition:opacity .5s;text-shadow:0 0 12px #000}
  #banner.on{opacity:.92}
  #tip{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:12px;opacity:0;transition:opacity .4s}
  #tip.on{opacity:.7}
  .btn{position:absolute;border-radius:50%;border:1.5px solid rgba(216,210,196,.5);background:rgba(20,18,16,.35);
    display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.1em;color:#d8d2c4;pointer-events:auto}
  .btn.act{background:rgba(185,58,44,.5)}
  #fire{right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:88px;height:88px;font-size:14px}
  #reload{right:calc(122px + env(safe-area-inset-right));bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px}
  #center{right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:46px;height:46px;font-size:11px;display:none}
  body.gyro #center{display:flex}
  #ads{right:calc(40px + env(safe-area-inset-right));bottom:calc(126px + env(safe-area-inset-bottom));width:52px;height:52px}
  #swap{right:calc(112px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom));width:48px;height:48px}
  body.desk .btn,body.desk #stick,body.remote .btn,body.remote #stick{display:none}
  #wname{font-size:12px;font-weight:400;letter-spacing:.2em;opacity:.65;text-align:right}
  #scope{position:absolute;inset:0;opacity:0;
    background:
      linear-gradient(#000,#000) center/1.5px 100% no-repeat,linear-gradient(#000,#000) center/100% 1.5px no-repeat,
      radial-gradient(circle at 50% 50%,transparent 0,transparent 33vmin,rgba(0,0,0,.85) 34.5vmin,#000 36vmin)}
  #qr img{width:min(60vmin,280px);height:auto;image-rendering:pixelated;border-radius:4px;display:block}
  #pairUrl{margin-top:10px;font-size:11px;opacity:.5;word-break:break-all;max-width:420px;user-select:text;-webkit-user-select:text}
  #pairMsg{margin:14px 0 10px;font-size:15px;letter-spacing:.08em;min-height:1.4em}
  #modes{display:flex;gap:8px;margin-bottom:8px}
  .chip{min-width:0;margin:0;padding:8px 16px;font-size:14px;background:transparent;border-color:rgba(230,220,196,.3)}
  .chip.on{background:rgba(185,58,44,.45);border-color:rgba(230,220,196,.7)}
  #modeDesc{font-size:12px;opacity:.6;margin-bottom:14px;max-width:440px;line-height:1.7;min-height:1.7em}
  #sensRow{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.7;margin-top:12px}
  #sens{width:150px;accent-color:#b93a2c}
  .help{margin-top:10px}
  #perks{background:rgba(0,0,0,.6)}
  #pkList{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .pk{min-width:0;width:170px;padding:18px 12px;margin:0;display:flex;flex-direction:column;gap:8px;background:rgba(20,16,12,.85)}
  .pk b{font-size:17px;letter-spacing:.15em;color:#ffd9a0}.pk span{font-size:12px;opacity:.75;letter-spacing:.03em;line-height:1.5}
  #combo{color:#ffd23a;font-size:13px;min-height:1.3em;margin-top:2px}
  #bossbar{width:220px;height:6px;margin:4px auto 0;border:1px solid rgba(216,210,196,.5);opacity:0;transition:opacity .4s}
  #bossbar i{display:block;height:100%;background:#c9c2e8;width:100%}
  #dmgdir{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;box-sizing:border-box;
    border:6px solid transparent;border-top-color:rgba(255,70,45,.9);opacity:0}
  #cPerks{display:flex;flex-direction:column;gap:10px;width:86%}
  #cPerks .pk{width:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:14px}
  #starts{display:flex;flex-direction:column;align-items:center}
  .screen{overflow-y:auto}
  @media (max-height:480px){
    h1{font-size:30px}.sub{margin:2px 0 8px;font-size:11px}
    #starts{flex-direction:row;flex-wrap:wrap;justify-content:center}
    button{padding:9px 14px;min-width:150px;font-size:13px;margin:4px}
    #modeDesc{margin-bottom:6px}.help{font-size:11px;line-height:1.6;margin-top:6px}
    .pk{width:150px;padding:12px 10px}
  }
  /* 手機遙控器頁面 */
  #ctrl{position:fixed;inset:0;z-index:50;background:#0b0a09;display:flex;flex-direction:column;touch-action:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #cJoin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  #cJoin p{font-size:14px;line-height:1.9;opacity:.65;margin:14px 0 22px}
  #cMsg{margin-top:16px;font-size:13px;color:#ffb3a6;min-height:1.4em}
  #cPad{flex:1;display:none;flex-direction:column;min-height:0}
  #cNet{font-size:10px;padding:2px 6px;border:1px solid rgba(216,210,196,.35);border-radius:3px;opacity:.7;letter-spacing:.05em}
  #cTop{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:14px;letter-spacing:.12em}
  #cA{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  #cHp{flex:1;height:8px;border:1px solid rgba(216,210,196,.45)}#cHp i{display:block;height:100%;width:100%;background:#b93a2c}
  #cSwipe{flex:1;min-height:60px;margin:0 12px;border:1px dashed rgba(216,210,196,.22);border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:13px;letter-spacing:.2em;opacity:.8;gap:14px}
  #cSwipe span{opacity:.45;font-size:11px;line-height:1.9;letter-spacing:.08em;text-align:center;padding:0 10px}
  #cRow{display:flex;gap:8px;padding:12px}
  .cb{flex:1;padding:16px 0;text-align:center;border:1.5px solid rgba(216,210,196,.45);border-radius:8px;font-size:15px;letter-spacing:.1em;background:rgba(255,255,255,.03)}
  .cb.act,#cFire.act{background:rgba(185,58,44,.55)}
  #cBottom{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 22px}
  #cStick{width:150px;height:150px;border-radius:50%;border:1.5px solid rgba(216,210,196,.35);position:relative}
  #cKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(216,210,196,.35)}
  #cFire{width:140px;height:140px;border-radius:50%;border:2px solid rgba(230,220,196,.6);display:flex;align-items:center;justify-content:center;
    font-size:20px;letter-spacing:.2em;background:rgba(185,58,44,.18)}
  #cStart{min-width:200px}
  #stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    border:1.5px solid rgba(216,210,196,.3);display:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(216,210,196,.3)}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 35%,rgba(40,30,18,.55),rgba(0,0,0,.94) 70%);text-align:center;padding:20px;box-sizing:border-box}
  .screen.hide{display:none}
  h1{margin:0;font-size:clamp(38px,9vw,72px);letter-spacing:.35em;text-indent:.35em;font-weight:700;color:#e6dcc4;
    text-shadow:0 0 28px rgba(255,170,80,.35)}
  .sub{margin:8px 0 18px;font-size:13px;letter-spacing:.4em;text-indent:.4em;opacity:.55}
  button{font:inherit;color:#e6dcc4;background:rgba(185,58,44,.2);border:1px solid rgba(230,220,196,.55);
    padding:13px 28px;margin:6px;min-width:230px;font-size:16px;letter-spacing:.15em;border-radius:3px}
  button.alt{background:transparent;border-color:rgba(230,220,196,.28);font-size:14px}
  button:active{background:rgba(185,58,44,.55)}
  .help{margin-top:20px;font-size:12px;line-height:1.9;opacity:.55;max-width:460px}
  #final{font-size:15px;line-height:2;margin:4px 0 20px;opacity:.85}
  #over h1{color:#b93a2c;text-shadow:0 0 30px rgba(185,58,44,.5)}
  #err{position:fixed;left:0;right:0;bottom:0;z-index:99;font-size:11px;color:#f88;padding:6px;white-space:pre-wrap;pointer-events:none}
</style>
</head>

<script>
/* ───────── 中繼線路：精簡的 MQTT over WebSocket 用戶端（主機與遙控器共用） ─────────
   兩台裝置各自連到公用中繼站，不需要互相直連，所以行動網路、不同 Wi-Fi 都能通。 */
window.B2 = {
  RELAYS: ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/'],
  relay(url, sub, onMsg, onUp) {
    let ws, ping, closed = false, buf = new Uint8Array(0);
    const enc = new TextEncoder(), dec = new TextDecoder();
    const str = t => { const b = enc.encode(t); return [b.length >> 8, b.length & 255, ...b]; };
    const pkt = (h, body) => {
      if (!ws || ws.readyState !== 1) return; const l = []; let n = body.length;
      do { let d = n % 128; n = n >> 7; if (n) d |= 128; l.push(d); } while (n);
      ws.send(new Uint8Array([h, ...l, ...body]));
    };
    function open() {
      try { ws = new WebSocket(url, 'mqtt'); } catch (e) { return; }
      ws.binaryType = 'arraybuffer'; buf = new Uint8Array(0);
      ws.onopen = () => pkt(0x10, [...str('MQTT'), 4, 2, 0, 30, ...str('b2' + Math.random().toString(36).slice(2, 12))]);
      ws.onmessage = e => {
        const a = new Uint8Array(e.data), nb = new Uint8Array(buf.length + a.length); nb.set(buf); nb.set(a, buf.length); buf = nb;
        for (;;) {
          if (buf.length < 2) break; let i = 1, len = 0, m = 1, d;
          do { if (i >= buf.length) return; d = buf[i++]; len += (d & 127) * m; m *= 128; } while (d & 128);
          if (buf.length < i + len) break;
          const t = buf[0] >> 4, body = buf.slice(i, i + len); buf = buf.slice(i + len);
          if (t === 2) { if (body[1] === 0) { pkt(0x82, [0, 1, ...str(sub), 0]); clearInterval(ping); ping = setInterval(() => pkt(0xC0, []), 20000); if (onUp) onUp(); } }
          else if (t === 3) { const tl = body[0] << 8 | body[1]; onMsg(dec.decode(body.subarray(2 + tl))); }
        }
      };
      ws.onclose = () => { clearInterval(ping); if (!closed) setTimeout(open, 2000); }; ws.onerror = () => { };
    }
    open();
    return { pub(t, m) { pkt(0x30, [...str(t), ...enc.encode(m)]); }, close() { closed = true; try { ws.close(); } catch (e) { } } };
  }
};
/* ───────── 手機遙控器頁面（網址帶 ?c=主機代碼 時啟用） ───────── */
(function () {
  const hostId = new URLSearchParams(location.search).get('c'); if (!hostId) return;
  window.__CTRL = true; document.getElementById('menu').classList.add('hide'); document.title = '地下室 · 遙控器';
  const el = document.createElement('div'); el.id = 'ctrl';
  el.innerHTML = `
    <div id="cJoin"><h1 style="font-size:40px">遙控器</h1>
      <p>直握手機，像拿電視遙控器一樣把頂端指向螢幕<br>指到哪裡準星就到哪裡，指向畫面邊緣會自動轉身</p>
      <button id="cGo">連線並啟用陀螺儀</button><div id="cMsg"></div></div>
    <div id="cPad">
      <div id="cTop"><span id="cNet"></span><span id="cW">手槍</span><span id="cA">12 / 12</span><div id="cHp"><i></i></div></div>
      <div id="cSwipe"><button id="cStart">開始遊戲</button><div id="cPerks"></div><span>指向螢幕邊緣會自動轉身 · 在這裡滑動可快速轉身<br>準星偏掉時：把手機指向螢幕正中央再按「回正」</span></div>
      <div id="cRow"><div class="cb" data-k="ads">開鏡</div><div class="cb" data-k="reload">換彈</div><div class="cb" data-k="next">換槍</div><div class="cb" data-k="center">回正</div></div>
      <div id="cBottom"><div id="cStick"><div id="cKnob"></div></div><div id="cFire">射擊</div></div>
    </div>`;
  document.body.appendChild(el);
  const $ = s => el.querySelector(s), DEG = Math.PI / 180;
  const st = { y: 0, p: 0, dx: 0, dp: 0, mx: 0, my: 0, f: 0, a: 0, c: 0 };   // y/p：手機相對「回正」時的偏角（弧度）；dx/dp：滑動轉身累積量
  let pkKey = '', conn = null, timer = 0, acc = 0, last = null, beta = 0, a0 = 0, b0 = 0, dragY = 0, dragP = 0;
  const msg = t => { $('#cMsg').textContent = t; };
  // 手機頂端指向螢幕：alpha＝左右轉向、beta＝上下俯仰；alpha 會在 0/360 跳變，這裡累加成連續角度
  function onOri(e) {
    if (e.alpha == null || e.beta == null) return;
    if (last != null) { let d = e.alpha - last; if (d > 180) d -= 360; if (d < -180) d += 360; acc += d; }
    last = e.alpha; beta = e.beta;
  }
  function center() { a0 = acc; b0 = beta; dragY = dragP = 0; st.c++; }
  const qs = new URLSearchParams(location.search), topC = 'b2g/' + hostId + '/c', topH = 'b2g/' + hostId + '/h';
  let relay = null, linked = false, heard = 0, p2pHeard = 0, nTick = 0;
  const p2p = () => conn && conn.open && Date.now() - p2pHeard < 4000;
  const send = d => { if (p2p()) conn.send(d); else if (relay) relay.pub(topC, JSON.stringify(d)); };
  function tick() {     // 直連每秒約 30 次；走中繼時減半，避免被公用中繼站限速
    st.y = (acc - a0) * DEG; st.p = (beta - b0) * DEG; st.dx = dragY; st.dp = dragP; nTick++;
    const d = Object.assign({ t: 's' }, st);
    if (p2p()) conn.send(d); else if (relay && nTick % 2 === 0) relay.pub(topC, JSON.stringify(d));
  }
  function showPad(on) { $('#cJoin').style.display = on ? 'none' : 'flex'; $('#cPad').style.display = on ? 'flex' : 'none'; }
  function link() {
    heard = Date.now(); $('#cNet').textContent = p2p() ? '直連' : '中繼';
    if (linked) return; linked = true; showPad(true); center(); clearInterval(timer); timer = setInterval(tick, 33);
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { }
  }
  function onData(d) {
    if (!d) return; link();
    if (d.t === 'v') { if (navigator.vibrate) navigator.vibrate(d.ms); }
    else if (d.t === 'h') {
      $('#cW').textContent = d.w; $('#cA').textContent = (d.r ? '換彈中' : d.a + ' / ' + d.m); $('#cHp i').style.width = d.hp + '%';
      const b = $('#cStart'); b.style.display = d.st === 'play' || d.st === 'perk' ? 'none' : ''; b.textContent = d.st === 'dead' ? '再來一次' : '開始遊戲';
