<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>地下室 B2</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#d8d2c4;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #touch{position:fixed;inset:0;touch-action:none;z-index:2}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
  #hud.on{display:block}
  #cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:.8}
  #cross i{position:absolute;background:#e9e2cf;box-shadow:0 0 2px #000}
  #cross i:nth-child(1){left:12px;top:12px;width:2px;height:2px;border-radius:50%}
  #cross i:nth-child(2){left:0;top:12.5px;width:7px;height:1px}
  #cross i:nth-child(3){right:0;top:12.5px;width:7px;height:1px}
  #cross i:nth-child(4){left:12.5px;top:0;width:1px;height:7px}
  #cross i:nth-child(5){left:12.5px;bottom:0;width:1px;height:7px}
  #hit{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0;transform:rotate(45deg)}
  #hit::before,#hit::after{content:"";position:absolute;background:#ff5a4a}
  #hit::before{left:0;right:0;top:14px;height:2px}
  #hit::after{top:0;bottom:0;left:14px;width:2px}
  #hit.head::before,#hit.head::after{background:#ffd23a}
  .tl{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
  .lbl{font-size:11px;letter-spacing:.2em;opacity:.6}
  #hpbar{width:150px;height:8px;margin-top:5px;border:1px solid rgba(216,210,196,.45);background:rgba(0,0,0,.4)}
  #hpfill{height:100%;width:100%;background:#b93a2c;transition:width .15s}
  .tc{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;
    font-size:12px;letter-spacing:.2em;opacity:.75;white-space:nowrap}
  #score{font-size:18px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
  #ammo{position:absolute;right:calc(128px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));
    font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
  #ammo small{font-size:13px;opacity:.6;font-weight:400}
  #ammo.low{color:#ff5a4a}
  body.desk #ammo{right:28px}
  #banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:26px;letter-spacing:.5em;
    opacity:0;transition:opacity .5s;text-shadow:0 0 12px #000}
  #banner.on{opacity:.92}
  #tip{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:12px;opacity:0;transition:opacity .4s}
  #tip.on{opacity:.7}
  .btn{position:absolute;border-radius:50%;border:1.5px solid rgba(216,210,196,.5);background:rgba(20,18,16,.35);
    display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.1em;color:#d8d2c4;pointer-events:auto}
  .btn.act{background:rgba(185,58,44,.5)}
  #fire{right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:88px;height:88px;font-size:14px}
  #reload{right:calc(122px + env(safe-area-inset-right));bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px}
  #center{right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:46px;height:46px;font-size:11px;display:none}
  body.gyro #center{display:flex}
  body.desk .btn,body.desk #stick{display:none}
  #stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    border:1.5px solid rgba(216,210,196,.3);display:none}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(216,210,196,.3)}
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 35%,rgba(40,30,18,.55),rgba(0,0,0,.94) 70%);text-align:center;padding:20px;box-sizing:border-box}
  .screen.hide{display:none}
  h1{margin:0;font-size:clamp(38px,9vw,72px);letter-spacing:.35em;text-indent:.35em;font-weight:700;color:#e6dcc4;
    text-shadow:0 0 28px rgba(255,170,80,.35)}
  .sub{margin:8px 0 26px;font-size:13px;letter-spacing:.4em;text-indent:.4em;opacity:.55}
  button{font:inherit;color:#e6dcc4;background:rgba(185,58,44,.2);border:1px solid rgba(230,220,196,.55);
    padding:13px 28px;margin:6px;min-width:230px;font-size:16px;letter-spacing:.15em;border-radius:3px}
  button.alt{background:transparent;border-color:rgba(230,220,196,.28);font-size:14px}
  button:active{background:rgba(185,58,44,.55)}
  .help{margin-top:20px;font-size:12px;line-height:1.9;opacity:.55;max-width:460px}
  #final{font-size:15px;line-height:2;margin:4px 0 20px;opacity:.85}
  #over h1{color:#b93a2c;text-shadow:0 0 30px rgba(185,58,44,.5)}
  #err{position:fixed;left:0;right:0;bottom:0;z-index:99;font-size:11px;color:#f88;padding:6px;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<div id="touch"></div>
<div id="hud">
  <div class="tl"><div class="lbl">生命</div><div id="hpbar"><div id="hpfill"></div></div></div>
  <div class="tc"><div id="wave">第 1 波</div><div id="score">0</div></div>
  <div id="cross"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="hit"></div>
  <div id="banner"></div>
  <div id="ammo">24 <small>/ ∞</small></div>
  <div id="tip"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" id="fire">射擊</div>
  <div class="btn" id="reload">換彈</div>
  <div class="btn" id="center">回正</div>
</div>

<div class="screen" id="menu">
  <h1>地下室</h1>
  <div class="sub">B2 · 燈快熄了</div>
  <button id="bGyro">開始 · 陀螺儀瞄準</button>
  <button id="bTouch" class="alt">開始 · 觸控瞄準</button>
  <div class="help" id="help"></div>
</div>
<div class="screen hide" id="over">
  <h1>你倒下了</h1>
  <div id="final"></div>
  <button id="bAgain">再來一次</button>
</div>
<div id="err"></div>

<script>
  window.addEventListener('error', e => { document.getElementById('err').textContent = '載入錯誤：' + (e.message || '資源無法載入，請確認網路連線'); });
</script>

class Particles {
  constructor(n, additive) {

    this.vel = new Float32Array(n * 3); this.life = new Float32Array(n); this.max = new Float32Array(n); this.grav = new Float32Array(n); this.s0 = new Float32Array(n);
    const g = this.geo = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 4));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
      uniforms: { uScale: { value: 500 } },
      vertexShader: `attribute vec4 aColor; attribute float aSize; uniform float uScale; varying vec4 vC;
        void main(){ vC=aColor; vec4 mv=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*mv; gl_PointSize=aSize*uScale/max(.05,-mv.z); }`,
      fragmentShader: `varying vec4 vC; void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor=vec4(vC.rgb, vC.a*smoothstep(.5,.2,d)); }`

  }
  emit(x, y, z, vx, vy, vz, life, size, r, g, b, grav) {
    const i = this.i; this.i = (i + 1) % this.n;
    this.pos.set([x, y, z], i * 3); this.vel.set([vx, vy, vz], i * 3); this.col.set([r, g, b, 1], i * 4);
    this.life[i] = this.max[i] = life; this.size[i] = this.s0[i] = size; this.grav[i] = grav;
  }
  update(dt) {
    const { pos, vel, life, max, col, size, grav, n } = this;
    for (let i = 0; i < n; i++) {
      if (life[i] <= 0) continue;
      life[i] -= dt; const j = i * 3;
      if (life[i] <= 0) { size[i] = 0; continue; }
      vel[j + 1] -= grav[i] * dt;
      pos[j] += vel[j] * dt; pos[j + 1] += vel[j + 1] * dt; pos[j + 2] += vel[j + 2] * dt;
      if (pos[j + 1] < .015) { pos[j + 1] = .015; vel[j] = vel[j + 1] = vel[j + 2] = 0; }
      col[i * 4 + 3] = Math.min(1, life[i] / max[i] * 2);
    }
    this.geo.attributes.position.needsUpdate = this.geo.attributes.aColor.needsUpdate = this.geo.attributes.aSize.needsUpdate = true;
  }
}

  const g = ac.createGain(); g.gain.value = .22; n.connect(f); f.connect(g); g.connect(master); n.start();

}

// 觸控：左側搖桿移動、右側拖曳轉向、射擊鈕按住連發（按住時也能拖曳微調）
const touchEl = $('hud'), tmap = new Map(), stick = $('stick'), knob = $('knob');
let lookDX = 0, lookDY = 0;
function tStart(e) {
  if (state !== 'play') return; e.preventDefault();
  for (const t of e.changedTouches) {
    const el = t.target.closest ? t.target.closest('.btn') : null; let type;
    if (el && el.id === 'reload') { reload(); continue; }
    if (el && el.id === 'center') { calibrate(yawOf(qSmooth)); pitchNudge(); continue; }
    if (el && el.id === 'fire') { type = 'fire'; input.fire = true; el.classList.add('act'); }
    else if (t.clientX < vw * .4 && ![...tmap.values()].some(v => v.type === 'move')) {
      type = 'move'; stick.style.display = 'block'; stick.style.left = t.clientX + 'px'; stick.style.top = t.clientY + 'px'; knob.style.transform = '';
    } else type = 'look';
    tmap.set(t.identifier, { type, sx: t.clientX, sy: t.clientY, x: t.clientX, y: t.clientY });
  }
}
function pitchNudge() { showTip('視角已回正'); }
function tMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = tmap.get(t.identifier); if (!s) continue;
    if (s.type === 'move') {
      let dx = t.clientX - s.sx, dy = t.clientY - s.sy; const l = Math.hypot(dx, dy), R = 50;
      if (l > R) { dx *= R / l; dy *= R / l; }
      input.mx = dx / R; input.my = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`;
    } else { lookDX += t.clientX - s.x; lookDY += t.clientY - s.y; }
    s.x = t.clientX; s.y = t.clientY;
  }
}
function tEnd(e) {
  for (const t of e.changedTouches) {
    const s = tmap.get(t.identifier); if (!s) continue; tmap.delete(t.identifier);
    if (s.type === 'move') { input.mx = input.my = 0; stick.style.display = 'none'; }
    if (s.type === 'fire') { input.fire = false; $('fire').classList.remove('act'); }

    const alive = updateEnemies(dt, t);
    if (toSpawn > 0) { spawnT -= dt; if (spawnT <= 0 && alive < Math.min(12, 4 + wave)) { spawnEnemy(); toSpawn--; spawnT = Math.max(.55, 2.3 - wave * .16) * rand(.7, 1.3); } }
    else if (alive === 0 && waveGap <= 0) { waveGap = 4; hp = Math.min(100, hp + 20); showBanner('暫時安靜了…'); hud(); }
    if (waveGap > 0) { waveGap -= dt; if (waveGap <= 0) startWave(wave + 1); }
    deathTilt = 0;
  } else {
    updateEnemies(dt, t);
    if (state === 'dead') { deathTilt = Math.min(1, deathTilt + dt * 1.4); player.y = EYE - deathTilt * 1.2; }
    else { yaw = Math.sin(t * .12) * .5; qBase.setFromEuler(eTmp.set(-.02, yaw, 0, 'YXZ')); gun.position.copy(GUN_BASE); }
    kick *= Math.exp(-dt * 13);
  }
  camera.quaternion.copy(qBase).multiply(qTmp.setFromAxisAngle(X, recoilP + rand(-1, 1) * shake)).multiply(qTmp.setFromAxisAngle(Z, rand(-1, 1) * shake * .6 + deathTilt * .9));

  if (flashT > 0) { flashT -= dt; if (flashT <= 0) flash.visible = false; }
  muzzleLight.intensity *= Math.exp(-dt * 28);
  sparks.update(dt); blood.update(dt); smoke.update(dt);
  for (const p of pools) if (p.visible && p.scale.x < p.userData.g) p.scale.setScalar(Math.min(p.userData.g, p.scale.x + dt * .35));
  damageFx = Math.max(0, damageFx - dt * 1.3);
  finalPass.uniforms.uDamage.value = state === 'dead' ? 1 : damageFx + (hp < 30 ? .3 + .15 * Math.sin(t * 5) : 0);
  finalPass.uniforms.uTime.value = t;
  if (ac && state === 'play') { dripT -= dt; if (dripT < 0) { dripT = rand(2.5, 8); sfx.drip(); } }

  composer.render(dt);

  // 動態解析度：維持流暢
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 2) {
    const fps = fpsN / fpsAcc; fpsAcc = fpsN = 0;
    if (fps < 42 && pixelRatio > .7) { pixelRatio = Math.max(.7, pixelRatio - .2); resize(); if (pixelRatio <= 1 && torch.castShadow) { torch.castShadow = false; } }
    else if (fps > 57 && pixelRatio < Math.min(devicePixelRatio, IS_TOUCH ? 1.5 : 2) - .05 && !document.hidden) { pixelRatio = Math.min(devicePixelRatio, pixelRatio + .1); resize(); }
  }
}
document.addEventListener('visibilitychange', () => { clock.getDelta(); if (ac) document.hidden ? ac.suspend() : ac.resume(); });
qBase.identity();
window.__game = { begin, get state() { return state; }, player, enemies, input, setLook(y, p) { yaw = y; pitch = p; }, hurtPlayer };
frame();
</script>
